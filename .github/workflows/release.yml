name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4 # v4
        with:
          persist-credentials: false
          submodules: "recursive"
          fetch-depth: 500
      - uses: dtolnay/rust-toolchain@stable
      - name: Add ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}
      - run: |
          sudo apt-get update && \
            sudo apt-get -y install libfontconfig1-dev libglib2.0-dev
        if: matrix.os == 'ubuntu-latest'
      - name: Install LLVM
        if: matrix.os == 'windows-2022'
        run: choco install -y llvm
      - name: Setup msbuild
        if: matrix.os == 'windows-2022'
        uses: microsoft/setup-msbuild@v1.3.1
      - run: cargo build --release --target ${{ matrix.target }}
        timeout-minutes: 20
        if: matrix.os == 'windows-2022'
        env:
          LIBCLANG_PATH: "C:\\Program Files\\LLVM\\bin"
      - run: cargo build --release --target ${{ matrix.target }}
        if: matrix.os != 'windows-2022'

      - name: Prepare release binary
        shell: bash
        run: |
          mkdir -p dist
          binary="miro-pdf"
          asset="miro-pdf-${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == *-windows-* ]]; then
            binary="${binary}.exe"
            asset="${asset}.exe"
          fi
          cp "target/${{ matrix.target }}/release/${binary}" "dist/${asset}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/miro-pdf-${{ matrix.target }}*
          name: Miro ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger_publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - run: gh workflow run publish.yml
        env:
          GH_TOKEN: ${{ github.token }}
