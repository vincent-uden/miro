# Miro PDF Viewer Configuration
# Lines starting with # are comments and are ignored
#
# Bindings take an optional mode: <binding> [mode] <action>
# Available modes are Normal and Presentation. Omitting the mode
# defaults to Normal.

# Command  Binding           Mode    Action
# ----------------------------------------------------------------------

Bind       j                 Normal  MoveDown
Bind       k                 Normal  MoveUp
Bind       h                 Normal  MoveLeft
Bind       l                 Normal  MoveRight
Bind       J                 Normal  NextPage
Bind       K                 Normal  PreviousPage
Bind       H                 Normal  PreviousTab
Bind       L                 Normal  NextTab

Bind       Up                Normal  MoveUp
Bind       Down              Normal  MoveDown
Bind       Left              Normal  MoveLeft
Bind       Right             Normal  MoveRight

Bind       PageUp            Normal  PreviousPage
Bind       PageDown          Normal  NextPage

Bind       Ctrl+b            Normal  PageUp
Bind       Ctrl+f            Normal  PageDown
Bind       Ctrl+u            Normal  HalfPageUp
Bind       Ctrl+d            Normal  HalfPageDown

Bind       Alt+Left          Normal  JumpBack
Bind       Alt+Right         Normal  JumpForward

Bind       0                 Normal  ZoomHome
Bind       _                 Normal  ZoomFit
Bind       -                 Normal  ZoomOut
Bind       Plus              Normal  ZoomIn
Bind       Ctrl+0            Normal  ZoomHome
Bind       Ctrl+-            Normal  ZoomOut
Bind       Ctrl+Plus         Normal  ZoomIn

Bind       Ctrl+r            Normal  ToggleDarkModePdf
Bind       Ctrl+i            Normal  ToggleDarkModeUi
Bind       Ctrl+B            Normal  ToggleSidebar
Bind       Ctrl+l            Normal  ToggleLinkHitboxes
Bind       Ctrl+k            Normal  TogglePageBorders
Bind       F11               Normal  ToggleFullscreen
Bind       F10               Normal  TogglePresentationMode

Bind       F1                Normal  SinglePageLayout
Bind       F2                Normal  DoublePageLayout
Bind       F3                Normal  DoublePageTitlePageLayout
Bind       F4                Normal  PresentationLayout
Bind       [                 Normal  RotatePageCounterClockwise
Bind       ]                 Normal  RotatePageClockwise
Bind       {                 Normal  RotateAllPagesCounterClockwise
Bind       }                 Normal  RotateAllPagesClockwise

Bind       Ctrl+o            Normal  OpenFileFinder
Bind       Ctrl+p            Normal  PrintPdf
Bind       "Z Z"             Normal  CloseTab
Bind       q                 Normal  Exit
Bind       Ctrl+w            Normal  CloseTab

Bind       /                 Normal  OpenSearch
Bind       Escape            Normal  CloseSearch
Bind       n                 Normal  NextSearchResult
Bind       p                 Normal  PreviousSearchResult
Bind       N                 Normal  PreviousSearchResult
Bind       Ctrl+n            Normal  ToggleSearchMethod

Bind       Tab               Normal  NextTab
Bind       Shift+Tab         Normal  PreviousTab

MouseBind  MouseLeft         Normal  Panning
MouseBind  Shift+MouseLeft   Normal  Selection
MouseBind  MouseMiddle       Normal  Panning
MouseBind  MouseRight        Normal  Selection
MouseBind  MouseForward      Normal  NextPage
MouseBind  MouseBack         Normal  PreviousPage
MouseBind  ScrollUp          Normal  MoveUp
MouseBind  ScrollDown        Normal  MoveDown
MouseBind  Ctrl+ScrollUp     Normal  ZoomIn
MouseBind  Ctrl+ScrollDown   Normal  ZoomOut
MouseBind  Shift+ScrollUp    Normal  MoveLeft
MouseBind  Shift+ScrollDown  Normal  MoveRight

Set        DarkModePdf          False
Set        DarkModeUi           True
Set        OpenSidebar          False
Set        PageBorders          True
Set        DefaultSearchMethod  PlainText
Set        OpenFullscreen       False
Set        OpenPresentation     False
Set        Rpc                  False
Set        RpcPort              7890
Set        RpcAllowLan          False
Set        TrackpadSensitivity  1.0
